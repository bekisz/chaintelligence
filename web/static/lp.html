<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaintelligence | Positions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=side-brain-minimal">
    <link rel="stylesheet" href="/static/style.css?v=29.1">
    <script src="/static/lp.js?v=29.0"></script>
</head>

<body>
    <!-- Unified Uniswap-Style Header -->
    <header class="unified-header">
        <div class="header-content">
            <a href="/" class="logo-section">
                <img src="/static/logo.png?v=side-brain-minimal" alt="Chaintelligence" class="logo-icon">
                <span class="logo-text">Chaintelligence</span>
            </a>

            <nav class="nav-links">
                <a href="/pool" class="nav-link">Pools</a>
                <a href="/lp" class="nav-link active">Positions</a>
                <a href="/backtester" class="nav-link">Backtest</a>
                <a href="/routing" class="nav-link">Swaps</a>
                <a href="/pool-arena" class="nav-link">Pool Arena</a>
                <a href="/status" class="nav-link secondary-link">Health</a>
                <a href="/docs" class="nav-link secondary-link">API</a>
            </nav>
        </div>
    </header>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <nav class="glass main-nav" style="display: none;">
            <a href="/">Home</a>
            <a href="/routing">Route Analysis</a>
            <a href="/lp" class="active">LP Positions</a>
            <a href="/backtester">Backtester</a>
        </nav>

        <header style="display:none;">
        </header>

        <main>
            <section id="lp-summary-section" class="results-container">
                <div class="summary-cards">
                    <div class="card glass highlight-card">
                        <h3>Total Portfolio Value</h3>
                        <p id="total-portfolio-value" class="stat">--</p>
                    </div>
                    <div class="card glass highlight-card highlight-accent">
                        <h3>Total Unclaimed Rewards</h3>
                        <p id="total-rewards" class="stat">--</p>
                    </div>
                </div>

                <div class="controls-bar glass">
                    <div class="filter-group">
                        <label>Filter:</label>
                        <select id="network-filter">
                            <option value="all">All Networks</option>
                            <option value="Ethereum">Ethereum</option>
                            <option value="Arbitrum">Arbitrum</option>
                            <option value="Base">Base</option>
                            <option value="Polygon">Polygon</option>
                        </select>
                        <select id="protocol-filter">
                            <option value="all">All Protocols</option>
                        </select>
                        <select id="wallet-filter">
                            <option value="all">All Wallets</option>
                        </select>
                        <input type="text" id="search-filter" placeholder="Search pair...">
                        <div style="display:flex; align-items:center; margin-left:1rem;">
                            <input type="checkbox" id="hide-closed-filter" checked>
                            <label for="hide-closed-filter"
                                style="margin-left:0.4rem; font-size:0.8rem; cursor:pointer; text-transform:none;">Hide
                                Closed</label>
                        </div>
                    </div>
                    <div class="sort-group">
                        <label>Sort by:</label>
                        <select id="sort-by">
                            <option value="value-desc">Value (High to Low)</option>
                            <option value="value-asc">Value (Low to High)</option>
                            <option value="rewards-desc">Rewards (High to Low)</option>
                            <option value="rewards-asc">Rewards (Low to High)</option>
                            <option value="pair">Pair Name</option>
                        </select>
                    </div>
                    <div class="column-selector-container" style="margin-left: 0.5rem; display: inline-block; vertical-align: middle;">
                            <button id="lp-options-btn" class="secondary-btn flex-center" title="Liquidity Pool Link Options" style="padding: 6px 8px; border-radius: 8px;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
                                     <!-- Small Eye -->
                                     <path d="M5 7.5s2.5-3.5 7-3.5 7 3.5 7 3.5-2.5 3.5-7 3.5-7-3.5-7-3.5z" stroke-width="1.6"/>
                                     <circle cx="12" cy="7.5" r="1.5" fill="currentColor"/>
                                     <!-- Wide Left-Right Arrow -->
                                     <path d="M6 19l-4-3 4-3"/>
                                     <path d="M2 16h20"/>
                                     <path d="M18 13l4 3-4 3"/>
                                </svg>
                            </button>
                            <div id="lp-options-dropdown" class="column-dropdown hidden">
                                <div class="dropdown-section">
                                    <label class="checkbox-label"><input type="checkbox" data-lp="tier" checked> <span class="fee-pill" style="font-size: 0.65rem; padding: 1px 4px; margin: 0 4px 0 2px;">%</span> Tier</label>
                                    <label class="checkbox-label"><input type="checkbox" data-lp="apr" checked> <span class="apr-label" style="font-size: 0.65rem; padding: 1px 4px; margin: 0 4px 0 2px;">%</span> APR</label>
                                    <label class="checkbox-label"><input type="checkbox" data-lp="dex" checked> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin: 0 4px 0 2px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Dex Link</label>
                                    <label class="checkbox-label"><input type="checkbox" data-lp="revert" checked> <img src="/static/assets/revert.svg" alt="" style="width: 14px; height: 14px; vertical-align: middle; margin: 0 4px 0 2px;" /> Revert Link</label>
                                    <label class="checkbox-label"><input type="checkbox" data-lp="dexscreener" checked> <img src="/static/assets/dexscreener.ico" alt="" style="width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin: 0 4px 0 2px;" /> DexScreener</label>
                                    <label class="checkbox-label"><input type="checkbox" data-lp="defillama" checked> <img src="/static/assets/defillama.ico" alt="" style="width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin: 0 4px 0 2px;" /> DeFi Llama</label>
                                    <label class="checkbox-label"><input type="checkbox" data-lp="explorer"> <img src="/static/assets/explorer.ico" alt="" style="width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin: 0 4px 0 2px;" /> Explorer</label>
                                    <label class="checkbox-label"><input type="checkbox" data-lp="geckoterminal"> <img src="/static/assets/geckoterminal.ico" alt="" style="width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin: 0 4px 0 2px;" /> GeckoTerminal</label>
                                    <label class="checkbox-label"><input type="checkbox" data-lp="defined"> <img src="/static/assets/defined.ico" alt="" style="width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin: 0 4px 0 2px;" /> Defined.fi</label>
                                </div>
                            </div>
                        </div>
                    </div>

                <div id="positions-grid" class="positions-grid">
                    <!-- Position cards will be injected here -->
                </div>
            </section>

            <div id="loader" class="loader-container hidden">
                <div class="spinner"></div>
                <p>Fetching LP snapshots from Postgres...</p>
            </div>

            <div id="no-data" class="no-data-msg hidden">
                <p>No liquidity position snapshots found in the database.</p>
            </div>
        </main>

        <footer>
        </footer>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal">
        <div class="modal-content glass">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Position History</h2>
            <div id="modal-loader" class="loader-container hidden">
                <div class="spinner"></div>
            </div>
            <div id="modal-body" class="history-table-container">
                <!-- Table will be injected here -->
            </div>
        </div>
    </div>

    <script src="/static/nav.js"></script>
    <!-- Script moved to head -->
</body>

</html>
