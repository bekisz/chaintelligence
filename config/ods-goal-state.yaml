# O&D Set data-governance policy — the declared GOAL STATE of ingested data.
#
# Read by the `ods_goal_state_retention` DAG, the API `/api/ods/goal-state`
# report and the CLI in chain-feeder/include/scripts/ods_goal_state.py. The
# engine keeps data for a (pair, layer) inside the window of the MOST-SPECIFIC
# matching requirement (override cascade); `defaults` is the global floor
# applied everywhere else.
#
# Specificity ranking (high > low):
#   1. token set: contract address > symbol > coin family > '*'
#   2. chains: specific chain(s) > '*'
#   3. window: explicit (since / from-to) > rolling (last_days)
#   tie -> the rule later in this file wins.
#
# Side selectors use the same syntax as /api/ods/set:
#   - a coin symbol (WBTC, USDC)
#   - a coin family (BTC, USD) — expands to all family members
#   - '*' — every coin on that side
#   - a coin contract address (0x…)
#
# Layers (each has its own independent window):
#   swaps                     raw swap rows (route-attributable via route_id)
#   route_daily_stats         per-(route, day) aggregates
#   route_daily_stats_bucket  per-(route, day, bucket) swap-size distribution
#   liquidity_pool            pool daily stats + position snapshots for the
#                             pools used as hops by the set's routes
#
# Window grammar per layer:
#   last_days: N          keep the last N days (rolling, ending today)
#   since: YYYY-MM-DD     keep from this day through today
#   from:/to: YYYY-MM-DD  keep an exact bounded window
#   absent / null         no requirement for that layer (default floor applies)
#
# NOTE: a layer whose default is null is "unclaimed" — every row of it that is
# not inside some requirement's window is a deletion candidate.

defaults:
  # Global floors — applied to every (pair, layer) not covered by a requirement.
  swaps: { last_days: 3 }
  route_daily_stats: ~
  route_daily_stats_bucket: ~
  liquidity_pool: { last_days: 32 }

  # Per-chain floors — these reproduce the old config/swap-retention.yaml
  # rules so config_global_swap_retention can be retired. A chain with no
  # per_chain entry falls back to the global floors above.
  per_chain:
    - chain: "Ethereum"
      swaps: { last_days: 180 }
    - chain: "BNB"
      swaps: { last_days: 8 }
    - chain: "Arbitrum"
      swaps: { last_days: 180 }

requirements:
  # BTC-family <-> USD-family on every chain: the flagship dashboard dataset.
  # Keep ALL raw swaps AND route_daily_stats from 2026-04-01 through today.
  # NOTE: the swaps layer is essential — route_daily_stats is a materialized
  # view rebuilt from swaps, so without a swaps retention clause a recompute
  # would silently erase daily stats once the raw rows age past their floor.
  - name: "BTC-USD daily stats since Apr"
    origin: "BTC"
    dest: "USD"
    direction: "both"
    chains: "*"
    swaps:
      since: "2026-04-01"
    route_daily_stats:
      since: "2026-04-01"

  # ETH <-> BTC on Ethereum: keep this exact 3-day raw-swap window.
  - name: "ETH-BTC swaps window"
    origin: "ETH"
    dest: "BTC"
    direction: "both"
    chains: "ethereum"
    swaps:
      from: "2026-08-13"
      to: "2026-08-15"

  # WBTC -> USDC (forward only): 40 days of raw swaps, 90 days of bucket
  # distribution, 120 days of pool history for the pools it routes over.
  - name: "WBTC-USDC swaps 40d"
    origin: "WBTC"
    dest: "USDC"
    direction: "forward"
    chains: "*"
    swaps:
      last_days: 40
    route_daily_stats_bucket:
      last_days: 90
    liquidity_pool:
      last_days: 120