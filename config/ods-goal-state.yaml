# O&D Set data-governance policy — the declared GOAL STATE of ingested data.
#
# Read by the `ods_goal_state_retention` DAG, the API `/api/ods/goal-state`
# report and the CLI in chain-feeder/include/scripts/ods_goal_state.py. The
# engine keeps data for a (pair, layer) inside the window of the MOST-SPECIFIC
# matching requirement (override cascade). There is no separate `defaults`
# category: the floor for any (pair, layer) is expressed as ordinary
# requirements with `origin: "*"` and `dest: "*"` (wild on both sides). They use
# the exact same config semantics as any other requirement — the cascade treats
# them as floors automatically because more-specific requirements override
# wild/wild rules.
#
# Specificity ranking (high > low):
#   1. token set: contract address > symbol > coin family > '*'
#   2. chains: specific chain(s) > '*'
#   3. window: explicit (since / from-to) > rolling (last_days)
#   tie -> the rule later in this file wins.
#
# Side selectors use the same syntax as /api/ods/set:
#   - a coin symbol (WBTC, USDC)
#   - a coin family (BTC, USD) — expands to all family members
#   - '*' — every coin on that side
#   - a coin contract address (0x…)
#
# `bidirectional` (default true): when true the requirement governs the pair
# in both orientations (origin<->dest); set `bidirectional: false` to match
# only the declared orientation (origin -> dest).
#
# Layers (each has its own independent window):
#   swaps                              raw swap rows (route-attributable via route_id)
#   route_daily_stats                  per-(route, day) aggregates
#   route_daily_stats_bucket           per-(route, day, bucket) swap-size distribution
#   liquidity_pool                     position snapshots for the pools used as hops
#   liquidity_pool_daily_stats         per-(pool, day) liquidity stats
#   liquidity_pool_daily_stats_bucket  per-(pool, day, bucket) liquidity distribution
#
# Window grammar per layer:
#   last_days: N          keep the last N days (rolling, ending today)
#   since: YYYY-MM-DD     keep from this day through today
#   from:/to: YYYY-MM-DD  keep an exact bounded window
#   absent / null         no requirement for that layer
#
# NOTE: a layer that no requirement (base or otherwise) covers is "unclaimed" —
# every row of it is a deletion candidate.
#
# A floor requirement's `swaps` window is also the per-chain floor applied to
# unclassified raw swaps (route_id IS NULL), which cannot be attributed to any
# O&D set. A chain-specific floor overrides the global floor for those rows too.

requirements:
  # === Floor requirements (wild on both sides) ===
  # A floor matches every pair and is overridden by any more-specific
  # requirement via the cascade. Chain-specific floors override the global
  # floor. route_daily_stats / route_daily_stats_bucket are intentionally
  # absent from the floors -> unclaimed -> deletable.

  - name: "Global"
    origin: "*"
    dest: "*"
    chains: "*"
    swaps:
      last_days: 2
    route_daily_stats:
      last_days: 8

  # Per-chain floors — reproduce the old config/swap-retention.yaml rules so
  # config_global_swap_retention can be retired. A chain with no specific
  # floor falls back to "Global" above.
  - name: "Ethereum Chain"
    origin: "*"
    dest: "*"
    chains: "Ethereum"
    swaps:
      last_days: 8
    route_daily_stats:
      last_days: 32
    route_daily_stats_bucket:
      last_days: 8
    liquidity_pool_daily_stats:
      last_days: 8
    liquidity_pool_daily_stats_bucket:
      last_days: 8

  # === O&D Set requirements (goal state) ===

  # BTC <-> USD on Ethereum: keep raw swaps for 14 days and route_daily_stats
  # from 2026-07-01 through today.
  # NOTE: the swaps layer is essential — route_daily_stats is a materialized
  # view rebuilt from swaps, so without a swaps retention clause a recompute
  # would silently erase daily stats once the raw rows age past their floor.
  - name: "BTC-USD"
    origin: "BTC"
    dest: "USD"
    chains: "Ethereum"
    swaps:
      last_days: 14
    route_daily_stats:
      since: "2026-07-01"

  - name: "WBTC-USDC"
    origin: "WBTC"
    dest: "USDC"
    chains: "ethereum"
    bidirectional: true # default is true
    swaps:
      last_days: 8
    route_daily_stats:
      since: "2025-08-01"
    route_daily_stats_bucket:
      last_days: 60
    liquidity_pool_daily_stats:
      last_days: 60
    liquidity_pool_daily_stats_bucket:
      last_days: 8
